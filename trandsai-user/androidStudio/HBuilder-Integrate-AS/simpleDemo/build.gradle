apply plugin: 'com.android.application'

android {
    repositories {
        flatDir {
            dirs 'libs'
        }
    }
    compileSdkVersion 36
    buildToolsVersion '36.0.0'
    namespace "com.gig.trandsai"
    defaultConfig {
        applicationId "com.gig.trandsai"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 185
        versionName "1.8.5"
        multiDexEnabled true
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        compileOptions {
            sourceCompatibility JavaVersion.VERSION_1_8
            targetCompatibility JavaVersion.VERSION_1_8
        }
    }
    signingConfigs {
        config {
            keyAlias '__uni__859c11f'
            keyPassword 'VMn6YJs4'
            storeFile file('app.keystore')
            storePassword 'VMn6YJs4'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.config
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-ignore.pro'
        }
        release {
            signingConfig signingConfigs.config
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-ignore.pro'
        }
    }
    aaptOptions {
        additionalParameters '--auto-add-overlay'
        ignoreAssetsPattern "!.svn:!.git:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~"
    }
    packaging {
        jniLibs {
            // false: keep .so uncompressed so AGP can 16KB-zip-align them for Play
            useLegacyPackaging true
        }
    }
}

// billing / play-services 会拉到 kotlin-stdlib 1.8+，同时旧库还带 jdk7/jdk8 1.6.21，造成 Duplicate class
configurations.configureEach {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:2.2.0"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.0"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.0"
        force "androidx.core:core:1.13.1"
        force "androidx.core:core-ktx:1.13.1"
        // 16KB page size: Fresco 3.4+ ships 16KB-aligned native libs
        force "com.facebook.fresco:fresco:3.6.0"
        force "com.facebook.fresco:imagepipeline:3.6.0"
        force "com.facebook.fresco:imagepipeline-native:3.6.0"
        force "com.facebook.fresco:imagepipeline-base:3.6.0"
        force "com.facebook.fresco:memory-type-native:3.6.0"
        force "com.facebook.fresco:nativeimagetranscoder:3.6.0"
        force "com.facebook.fresco:nativeimagefilters:3.6.0"
        force "com.facebook.fresco:animated-gif:3.6.0"
        force "com.facebook.fresco:animated-base:3.6.0"
        force "com.facebook.fresco:animated-drawable:3.6.0"
        force "com.facebook.fresco:webpsupport:3.6.0"
        force "com.facebook.fresco:middleware:3.6.0"
        force "com.facebook.fresco:ui-common:3.6.0"
        force "com.facebook.fresco:drawee:3.6.0"
        force "com.facebook.fresco:fbcore:3.6.0"
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'], exclude: [])
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation "androidx.fragment:fragment:1.1.0"
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'com.facebook.fresco:fresco:3.6.0'
    implementation 'com.facebook.fresco:animated-gif:3.6.0'
    implementation 'com.facebook.fresco:nativeimagetranscoder:3.6.0'
    implementation 'com.facebook.fresco:nativeimagefilters:3.6.0'
    implementation 'com.github.bumptech.glide:glide:4.9.0'
    implementation 'com.alibaba:fastjson:1.2.83'
    implementation 'androidx.webkit:webkit:1.5.0'
    implementation 'com.google.android.gms:play-services-auth:21.0.0'

    // UTS runtime deps (uni-app)
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.0"
    implementation "org.jetbrains.kotlin:kotlin-reflect:2.2.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.3.8"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.3.8"

    // Google Play Billing (also pulled by :trands-google-iap)
    implementation "com.android.billingclient:billing:9.1.0"

    // Firebase + attribution + self-owned IAP UTS modules
    implementation project(':trands-firebase-analytics')
    implementation project(':trands-attribution')
    implementation project(':trands-google-iap')

    // Also surface plugin deps on app (required by uni-app offline docs)
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation('com.google.firebase:firebase-analytics') {
        exclude group: 'com.google.android.gms', module: 'play-services-places-placereport'
    }
    implementation 'com.google.android.gms:play-services-ads-identifier:18.1.0'
    implementation 'com.android.installreferrer:installreferrer:2.2'
}

apply plugin: 'com.google.gms.google-services'
